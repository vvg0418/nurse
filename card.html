<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>alina · открытка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Открытка 148×105 мм (А6) для печати: слева надпись, справа QR-код на сайт. */
:root { --black: #120d10; --light: #e8dde3; --pink: #ff3d8b; --grey: #a8949f;
  --f-display: "Oswald", "Arial Narrow", Impact, sans-serif; --f-body: "Manrope", Arial, sans-serif; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #241a1f; color: var(--light); font-family: var(--f-body);
  display: grid; place-items: center; gap: 24px; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px)); }
.card { width: 148mm; height: 105mm; max-width: 100%; background: var(--black); position: relative; overflow: hidden;
  display: grid; grid-template-columns: 1fr 40mm; gap: 8mm; padding: 9mm; border-radius: 3mm; box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
  -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.card::before { content: ""; position: absolute; width: 90mm; height: 90mm; left: -25mm; bottom: -45mm; border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 61, 139, .55), transparent 70%); }
.left { position: relative; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
.kick { font-size: 3mm; letter-spacing: .18em; text-transform: uppercase; color: var(--grey); margin: 0; }
h1 { font-family: var(--f-display); font-weight: 700; color: var(--pink); font-size: 26mm; line-height: .9; margin: 0; letter-spacing: -.02em; }
.msg { font-size: 3.6mm; line-height: 1.4; margin: 0; max-width: 70mm; }
.right { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 3mm; align-items: stretch; }
.qr { background: #fff; border-radius: 2.5mm; padding: 2.5mm; aspect-ratio: 1; display: grid; place-items: center; }
.qr svg, .qr img { width: 100%; height: 100%; display: block; }
.hint { font-size: 2.6mm; color: var(--grey); text-align: center; margin: 0; overflow-wrap: anywhere; }
.cross { position: absolute; right: 9mm; top: 9mm; width: 9mm; fill: var(--pink); }
.tools { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center; }
.btn { font: inherit; font-weight: 700; font-size: 15px; border-radius: 999px; padding: 10px 20px; cursor: pointer; border: 1px solid var(--pink); background: var(--pink); color: var(--black); }
.tools p { margin: 0; color: var(--grey); font-size: 14px; max-width: 60ch; text-align: center; }
@media print {
  @page { size: 148mm 105mm; margin: 0; }
  body { background: none; padding: 0; display: block; min-height: 0; }
  .card { border-radius: 0; box-shadow: none; }
  .tools { display: none; }
}
@media (max-width: 600px) { .card { transform-origin: top center; } }
</style>
</head>
<body>
<div class="card">
  <svg class="cross" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg>
  <div class="left">
    <p class="kick">1 ноября</p>
    <h1>alina</h1>
    <p class="msg" id="msg">С днём рождения, Алиночка! Мы сделали для тебя кое-что особенное. Наведи камеру на код.</p>
  </div>
  <div class="right">
    <div class="qr" id="qr" aria-label="QR-код со ссылкой на сайт"></div>
    <p class="hint" id="hint"></p>
  </div>
</div>
<div class="tools">
  <button class="btn" type="button" onclick="window.print()">Распечатать</button>
  <p>Размер открытки 148×105 мм (А6). В окне печати выберите «Без полей» и включите «Фоновая графика», чтобы чёрный фон напечатался.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var url = params.get("u") || "https://alishka-eight.vercel.app";
  if (params.get("text")) document.getElementById("msg").textContent = params.get("text");
  document.getElementById("hint").textContent = url.replace(/^https?:\/\//, "");
  var box = document.getElementById("qr");
  if (window.qrcode) {
    var q = qrcode(0, "M"); q.addData(url); q.make();
    box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    var svg = box.querySelector("svg"); if (svg) { svg.setAttribute("width", "100%"); svg.setAttribute("height", "100%"); }
  } else {
    box.textContent = url;
    box.style.color = "#120d10"; box.style.fontSize = "3mm"; box.style.textAlign = "center";
  }
})();
</script>
</body>
</html>
